[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Long cache for hashed assets, short for HTML.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# PREVIEW ONLY. Keeps the netlify.app preview out of Google while originehealing.com
# is still the live site. Delete this block when the real domain is pointed here.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
